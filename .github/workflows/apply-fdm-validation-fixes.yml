name: Apply FDM validation fixes

on:
  push:
    branches:
      - sol/fdm-validation-fixes

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale validation fixtures and diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          # 1) Phase 2 synthetic snapshots: keep them aligned with the production
          # angular-dynamics readiness contract.
          p, s = load('Assets/MaverickFresh/Scripts/FlightDynamics/Validation/MavFlightDynamicsPhase2Validation.cs')
          old = '            snapshot.propulsionAcceptableForLiveFlight = true;'
          new = old + '\n            snapshot.angularDynamicsAcceptable = true;'
          s = replace_exact(s, old, new, 2, 'phase2 angular readiness')
          p.write_text(s, encoding='utf-8')

          # 2) Freeze hardening rig: explicitly configure the production angular
          # dynamics implementation rather than weakening the readiness gate.
          p, s = load('Assets/MaverickFresh/Scripts/FlightDynamics/Editor/MavFlightDynamicsFreezeHardeningValidation.cs')
          old = '''            body.acceptNonAuthoritativePropulsion = true;

            body.RefreshReadiness();'''
          new = '''            body.acceptNonAuthoritativePropulsion = true;
            body.applyBackendGyroscopicCompensation = true;

            body.RefreshReadiness();'''
          s = replace_exact(s, old, new, 1, 'freeze hardening readiness')
          p.write_text(s, encoding='utf-8')

          # 3) Integration rig: same production readiness precondition.
          p, s = load('Assets/MaverickFresh/Scripts/FlightDynamics/Editor/MavFlightDynamicsIntegrationValidation.cs')
          s = replace_exact(s, old, new, 1, 'integration readiness')
          p.write_text(s, encoding='utf-8')

          # 4) Ownership scan: retain a strict production writer boundary while
          # removing known lexical/validation/rollback false positives.
          p, s = load('Assets/MaverickFresh/Scripts/FlightDynamics/Validation/MavFlightDynamicsOwnershipScan.cs')

          old_exempt = '''            "MavSixDoFBody.cs",
            "MavFlightDynamicsIntegrationValidation.cs"'''
          new_exempt = '''            "MavSixDoFBody.cs",
            "MavFlightDynamicsIntegrationValidation.cs",
            "MavF16ReferenceFlightScenarios.cs"'''
          s = replace_exact(s, old_exempt, new_exempt, 1, 'ownership validation exemption')

          old_matcher = '''            for (int i = 0; i < ForbiddenTokens.Length; i++)
            {
                if (code.Contains(ForbiddenTokens[i]))
                    return true;
            }

            return false;'''
          new_matcher = '''            for (int i = 0; i < ForbiddenTokens.Length; i++)
            {
                if (ContainsForbiddenToken(code, ForbiddenTokens[i]))
                    return true;
            }

            return false;'''
          s = replace_exact(s, old_matcher, new_matcher, 1, 'ownership token matcher')

          anchor = '        public static string StripCommentsAndStringLiterals(string sourceLine)'
          helpers = r'''        private static bool ContainsForbiddenToken(string code, string token)
        {
            int searchFrom = 0;

            while (searchFrom < code.Length)
            {
                int index = code.IndexOf(token, searchFrom, System.StringComparison.Ordinal);
                if (index < 0)
                    return false;

                int after = index + token.Length;
                bool assignmentToken = token.EndsWith(" =", System.StringComparison.Ordinal);

                // Assignment tokens must not classify equality comparisons ("==") as writes.
                if (!assignmentToken || after >= code.Length || code[after] != '=')
                    return true;

                searchFrom = after + 1;
            }

            return false;
        }

        private static bool IsAllowedHandoverStateTransfer(string fileName, string sourceLine)
        {
            if (!string.Equals(
                    fileName,
                    "MavRuntimeHandoverTarget.cs",
                    System.StringComparison.Ordinal))
            {
                return false;
            }

            string code = StripCommentsAndStringLiterals(sourceLine).Trim();

            // The handover target owns only atomic capture/rollback of motion state.
            // Keep this list exact so a future force/torque writer in the same file still fails.
            return code == "c.linearVelocity = rb.linearVelocity;"
                || code == "c.angularVelocity = rb.angularVelocity;"
                || code == "rb.linearVelocity = linearVelocity;"
                || code == "rb.angularVelocity = angularVelocity;";
        }

'''
          s = replace_exact(s, anchor, helpers + anchor, 1, 'ownership helper insertion')

          old_scan = '''                    if (IsOwnershipViolation(lines[i]))
                        result.violations.Add(fileName + ":" + (i + 1) + ": " + lines[i].Trim());'''
          new_scan = '''                    if (IsOwnershipViolation(lines[i]) &&
                        !IsAllowedHandoverStateTransfer(fileName, lines[i]))
                    {
                        result.violations.Add(fileName + ":" + (i + 1) + ": " + lines[i].Trim());
                    }'''
          s = replace_exact(s, old_scan, new_scan, 1, 'ownership scan allowance')
          p.write_text(s, encoding='utf-8')

          # 5) WT feel: preserve the explicit no-authority diagnostic after the
          # handling-only fallback instead of overwriting it with the preset name.
          p, s = load('Assets/MaverickFresh/Scripts/MavWTFeelPolishController.cs')

          field = '        private bool loggedMissingAircraftAuthority;'
          field_new = field + '\n        private bool skippedAircraftAwareForMissingAuthority;'
          s = replace_exact(s, field, field_new, 1, 'WT diagnostic state field')

          apply_start = '''        public void ApplyPreset(MavWTFeelPreset p)
        {
            preset = p;
            Resolve();'''
          apply_start_new = '''        public void ApplyPreset(MavWTFeelPreset p)
        {
            preset = p;
            skippedAircraftAwareForMissingAuthority = false;
            Resolve();'''
          s = replace_exact(s, apply_start, apply_start_new, 1, 'WT diagnostic reset')

          reason = '''                lastApplied = "no aircraft applied yet: WT feel skipped its aircraft-aware pass "
                              + "rather than defaulting to one";'''
          reason_new = '''                skippedAircraftAwareForMissingAuthority = true;
                lastApplied = "no aircraft applied yet: WT feel skipped its aircraft-aware pass "
                              + "rather than defaulting to one";'''
          s = replace_exact(s, reason, reason_new, 1, 'WT missing-authority reason')

          final = '            lastApplied = p.ToString();'
          final_new = '''            if (!skippedAircraftAwareForMissingAuthority)
                lastApplied = p.ToString();'''
          s = replace_exact(s, final, final_new, 1, 'WT final diagnostic preservation')
          p.write_text(s, encoding='utf-8')

          print('Applied FDM validation fixes successfully.')
          PY

      - name: Sanity-check patch surface
        shell: bash
        run: |
          git diff --check
          git status --short
          test "$(git diff --name-only | wc -l)" -eq 5

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/MaverickFresh/Scripts/FlightDynamics/Validation/MavFlightDynamicsPhase2Validation.cs \
            Assets/MaverickFresh/Scripts/FlightDynamics/Editor/MavFlightDynamicsFreezeHardeningValidation.cs \
            Assets/MaverickFresh/Scripts/FlightDynamics/Editor/MavFlightDynamicsIntegrationValidation.cs \
            Assets/MaverickFresh/Scripts/FlightDynamics/Validation/MavFlightDynamicsOwnershipScan.cs \
            Assets/MaverickFresh/Scripts/MavWTFeelPolishController.cs
          git commit -m 'fix: align FDM validators with current readiness contract'
          git push origin HEAD:sol/fdm-validation-fixes
